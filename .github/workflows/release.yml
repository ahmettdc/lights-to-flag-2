name: Release

# Two ways to cut a release:
#  - push a tag like v1.0.0, or
#  - run this workflow manually (Actions → Release → Run workflow) with a version.
# Velopack turns the published app into a Setup.exe plus the update feed the app
# reads to update itself, and publishes them to a GitHub Release (creating the tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build installer & publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version and tag
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Publish (self-contained win-x64)
        run: dotnet publish src/LightsToFlag.App/LightsToFlag.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Pack with Velopack
        run: vpk pack -u LightsToFlag -v ${{ steps.ver.outputs.version }} -p publish -e LightsToFlag.App.exe --packTitle "Lights to Flag 2" --icon src/LightsToFlag.App/app.ico

      - name: Publish GitHub Release
        run: vpk upload github --repoUrl https://github.com/ahmettdc/lights-to-flag-2 --publish --releaseName "Lights to Flag 2 ${{ steps.ver.outputs.tag }}" --tag ${{ steps.ver.outputs.tag }} --token ${{ secrets.GITHUB_TOKEN }}
