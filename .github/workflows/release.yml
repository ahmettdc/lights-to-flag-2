name: Release

# Build a self-contained Windows package and cut a GitHub Release.
# Two ways in:
#   - push a v* tag                → release for that tag.
#   - run manually (workflow_dispatch) → release created via the API against the commit the run
#     started from (the tag is created server-side by `gh release create --target`). This path
#     exists because some environments can push branches but not tags; set create_release=false
#     for a build-only dry run that just uploads the zip as an artifact.
# ci.yml / build-matrix.yml run on branch pushes (build + test); this is tag/dispatch only, so it
# never double-runs with them.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.9.0), used on manual dispatch"
        required: false
        default: "0.9.0"
      create_release:
        description: "Create the GitHub Release (false = build + upload artifact only)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  windows:
    name: Windows (win-x64, self-contained)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            V="${{ github.event.inputs.version }}"
            TAG="v${V}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V (tag $TAG)"

      - name: Publish win-x64 (self-contained, no .NET needed on the target)
        run: >
          dotnet publish src/LTF.App/LTF.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/LightsToFlag2

      - name: Verify payload
        shell: bash
        run: |
          set -e
          root="publish/LightsToFlag2"
          test -f "$root/LTF.App.exe"              || { echo "missing LTF.App.exe"; exit 1; }
          test -f "$root/carsets/global-prix.json" || { echo "missing flagship carset"; exit 1; }
          ls "$root"/licenses/OFL-*.txt            || { echo "missing OFL licenses"; exit 1; }
          cp THIRD-PARTY-NOTICES.txt "$root/"
          echo "Payload OK"

      - name: Zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path publish/LightsToFlag2 -DestinationPath "LightsToFlag2-v$ver-win-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightsToFlag2-v${{ steps.ver.outputs.version }}-win-x64
          path: LightsToFlag2-v${{ steps.ver.outputs.version }}-win-x64.zip

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || github.event.inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # --target makes gh create the tag server-side (via the API) at this commit when it does
          # not already exist; for a tag-triggered run the tag is already there and --target is a
          # no-op. Either way no git tag push is required.
          gh release create "${{ steps.ver.outputs.tag }}" \
            "LightsToFlag2-v${{ steps.ver.outputs.version }}-win-x64.zip" \
            --target "${GITHUB_SHA}" \
            --title "Lights to Flag 2 v${{ steps.ver.outputs.version }}" \
            --notes-file "docs/release-notes/v0.9.0.md" \
            --prerelease
