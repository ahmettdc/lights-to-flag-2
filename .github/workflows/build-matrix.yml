name: Build matrix

# Windows and macOS are the product's ship targets, so they must not just compile
# but actually pass the tests here. Linux is covered (faster) in ci.yml.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore LightsToFlag2.sln

      - name: Build
        run: dotnet build LightsToFlag2.sln -c Release --no-restore

      - name: Test
        run: dotnet test LightsToFlag2.sln -c Release --no-build --verbosity normal
