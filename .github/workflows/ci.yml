name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore LightsToFlag2.sln

      - name: Build
        run: dotnet build LightsToFlag2.sln -c Release --no-restore

      - name: Test
        run: dotnet test LightsToFlag2.sln -c Release --no-build --verbosity normal
